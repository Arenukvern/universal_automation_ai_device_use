schema: steward/v1
repo:
  id: universal_automation_ai_device_use
  archetype: library
  archetype_detection:
    confidence: 1.0
    signals:
      - 'explicit --archetype'

harness:
  name: steward
  mode: cli
  entrypoints:
    cli: steward

adoption:
  status: adopting
  owner: universal_automation_ai_device_use
  gate:
    pillar: quality

stewardship:
  governance:
    charter: AGENTS.md
    adr_dir: docs/decisions
  knowledge:
    docs_map: AGENTS.md
    source_policy: required_for_external_claims
  repo_quality:
    contract_spec: steward.yaml
    maturity_model: general_stewardship
  skill_lifecycle:
    installable_skills: true
    registry: skills.json
  quality:
    validate: 'dart analyze pkgs/universal_automation_interface pkgs/universal_automation_semantics pkgs/universal_automation_conformance pkgs/universal_browser_cdp pkgs/universal_screencast pkgs/universal_lexicon pkgs/universal_webrtc_raw'
    evidence: .steward/evidence
  harness:
    enabled: false
    action_contract: deferred
  release:
    changelog: CHANGELOG.md
    artifact_provenance: required
  review_handoff:
    moe_required_for_architecture: true
  strategic_alignment:
    vision_source: AGENTS.md
    success_evidence: required
  security:
    action_effects: required
    redaction: steward/redaction/v1
  org:
    owners: AGENTS.md

docs:
  "ADR index": docs/decisions/README.md
  "Drivers extract": docs/decisions/0001_drivers_into_ua_private_oss_ready.md
  "Contributing": CONTRIBUTING.md
  "Security": SECURITY.md

actions: {}

probes: {}

diagnostics:
  cases: {}

unknown_cases:
  path: .steward/unknown-cases/
  retention: local

provenance:
  dependencies: []
  artifacts: []
  benchmarks: []
