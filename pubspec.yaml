name: ai_computer_use_universal_automation
description: >-
  Private workspace: computer-use automation family + lexicon.
  Storage lives in sibling ~/xs/universal_storage.
publish_to: none

environment:
  sdk: ^3.12.0

workspace:
  - pkgs/universal_automation_conformance
  - pkgs/universal_automation_interface
  - pkgs/universal_automation_semantics
  - pkgs/universal_automation_toolkit
  - pkgs/universal_browser_cdp
  - pkgs/universal_browser_webdriver
  - pkgs/universal_capture_flutter
  - pkgs/universal_capture_macos
  - pkgs/universal_driver_linux
  - pkgs/universal_driver_macos
  - pkgs/universal_driver_windows
  - pkgs/universal_lexicon
  - pkgs/universal_screencast
  - pkgs/universal_webrtc
  - pkgs/universal_webrtc_raw

dependency_overrides:
  meta: 1.19.0
  test_api: 0.7.13
  xsoulspace_permission_core:
    path: ../storage_problem/dart_flutter_packages/pkgs/xsoulspace_permission_core
  xsoulspace_lints:
    path: ../storage_problem/dart_flutter_packages/pkgs/xsoulspace_lints
