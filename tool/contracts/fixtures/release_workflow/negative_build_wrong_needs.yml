name: Release binaries build
run-name: release-binaries-build ${{ inputs.dry_run == true && 'dry-run' || inputs.release_tag }}

on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
      dry_run:
        required: false
        type: boolean
        default: false
      tooling_ref:
        required: true
        type: string
    outputs:
      release_tag:
        value: ${{ jobs.prepare.outputs.release_tag }}
      version:
        value: ${{ jobs.prepare.outputs.version }}
      release_sha:
        value: ${{ jobs.prepare.outputs.release_sha }}
    secrets:
      MACOS_CERT_P12:
        required: false
      MACOS_CERT_PASSWORD:
        required: false
      MACOS_CODESIGN_IDENTITY:
        required: false
      APPLE_ID:
        required: false
      APPLE_TEAM_ID:
        required: false
      APPLE_APP_PASSWORD:
        required: false

permissions:
  contents: read

concurrency:
  group: >-
    release-binaries-build-${{ inputs.dry_run == true && 'dry-run-' || '' }}${{ inputs.release_tag }}
  cancel-in-progress: false

env:
  TOOLING_CHECKOUT_PATH: _tooling
  RELEASE_SRC_PATH: release-src

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      version: ${{ steps.toolkit_version.outputs.version }}
      release_sha: ${{ steps.release_sha.outputs.sha }}
      release_ref: ${{ steps.resolve.outputs.release_ref }}
      dry_run: ${{ steps.resolve.outputs.dry_run }}
    steps:
      - name: Checkout workflow tooling at caller commit
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tooling_ref }}
          path: ${{ env.TOOLING_CHECKOUT_PATH }}
          persist-credentials: false

      - name: Resolve release target
        id: resolve
        env:
          DISPATCH_RELEASE_TAG: ${{ inputs.release_tag }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: bash "${{ env.TOOLING_CHECKOUT_PATH }}/tool/release/resolve_release_tag.sh"

      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.resolve.outputs.release_ref }}
          path: ${{ env.RELEASE_SRC_PATH }}
          fetch-depth: 1
          persist-credentials: false

      - id: release_sha
        name: Record and verify release commit SHA
        env:
          RELEASE_TAG: ${{ steps.resolve.outputs.release_tag }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          head_sha="$(git -C "${{ env.RELEASE_SRC_PATH }}" rev-parse "HEAD^{commit}")"
          if [[ "$DRY_RUN" != "true" ]]; then
            tag_sha="$(git -C "${{ env.RELEASE_SRC_PATH }}" rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
            if [[ "$tag_sha" != "$head_sha" ]]; then
              echo "::error::release-src HEAD ($head_sha) != tag^{commit} ($tag_sha)"
              exit 1
            fi
          fi
          echo "sha=$head_sha" >> "$GITHUB_OUTPUT"

      - id: toolkit_version
        name: Read toolkit version from release source
        env:
          RELEASE_ROOT: ${{ github.workspace }}/${{ env.RELEASE_SRC_PATH }}
        run: |
          bash "${{ env.TOOLING_CHECKOUT_PATH }}/tool/release/read_toolkit_version.sh"

      - name: Assert pubspec version at release source matches tag
        if: inputs.dry_run != true
        env:
          RELEASE_ROOT: ${{ github.workspace }}/${{ env.RELEASE_SRC_PATH }}
        run: |
          bash "${{ env.TOOLING_CHECKOUT_PATH }}/tool/release/assert_release_tag.sh" \
            "${{ steps.resolve.outputs.release_tag }}"

      - name: Verify GitHub release exists
        if: inputs.dry_run != true
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          bash "${{ env.TOOLING_CHECKOUT_PATH }}/tool/release/assert_github_release_exists.sh" \
            "${{ steps.resolve.outputs.release_tag }}"

  build:
    needs: []
    strategy:
      fail-fast: false
      matrix:
        include:
          - triple: darwin-arm64
            runner: macos-15
          - triple: darwin-x64
            runner: macos-15-intel
          - triple: linux-x64
            runner: ubuntu-latest
          - triple: windows-x64
            runner: windows-latest

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      HAS_SIGNING: >-
        ${{ inputs.dry_run != true && secrets.MACOS_CERT_P12 != '' &&
        secrets.MACOS_CERT_PASSWORD != '' }}
      HAS_CERT_P12: ${{ inputs.dry_run != true && secrets.MACOS_CERT_P12 != '' }}
      HAS_CERT_PASSWORD: >-
        ${{ inputs.dry_run != true && secrets.MACOS_CERT_PASSWORD != '' }}

    steps:
      - name: Checkout workflow tooling at caller commit
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tooling_ref }}
          path: ${{ env.TOOLING_CHECKOUT_PATH }}
          persist-credentials: false

      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.release_ref }}
          path: ${{ env.RELEASE_SRC_PATH }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify release source SHA
        shell: bash
        env:
          DRY_RUN: ${{ needs.prepare.outputs.dry_run }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
        run: |
          bash "${{ env.TOOLING_CHECKOUT_PATH }}/tool/release/verify_release_source_checkout.sh" \
            "${{ env.RELEASE_SRC_PATH }}" \
            "$RELEASE_TAG" \
            "$RELEASE_SHA" \
            "$DRY_RUN"

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Build staged release bundle
        shell: bash
        env:
          RELEASE_ROOT: ${{ github.workspace }}/${{ env.RELEASE_SRC_PATH }}
          VERSION: ${{ needs.prepare.outputs.version }}
          MATRIX_TRIPLE: ${{ matrix.triple }}
          RELEASE_TOOLING_DIR: ${{ github.workspace }}/${{ env.TOOLING_CHECKOUT_PATH }}/tool/release
        run: |
          bash "${{ env.TOOLING_CHECKOUT_PATH }}/tool/release/build_release_artifacts.sh" \
            --version "$VERSION" \
            --triple "$MATRIX_TRIPLE" \
            --skip-sign \
            --defer-archive

      - name: Warn partial macOS signing secrets
        if: >-
          inputs.dry_run != true &&
          (matrix.triple == 'darwin-arm64' || matrix.triple == 'darwin-x64') &&
          ((env.HAS_CERT_P12 == 'true') != (env.HAS_CERT_PASSWORD == 'true'))
        shell: bash
        run: |
          echo "::warning::Partial macOS signing secrets — configure both MACOS_CERT_P12 and MACOS_CERT_PASSWORD or neither"

      - name: Sign macOS bundle
        if: >-
          inputs.dry_run != true &&
          env.HAS_SIGNING == 'true' &&
          (matrix.triple == 'darwin-arm64' || matrix.triple == 'darwin-x64')
        shell: bash
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          VERSION: ${{ needs.prepare.outputs.version }}
          MATRIX_TRIPLE: ${{ matrix.triple }}
        run: |
          set -euo pipefail
          trap 'bash "${{ env.TOOLING_CHECKOUT_PATH }}/tool/release/cleanup_signing_keychain.sh"' EXIT
          sign_env="$(mktemp)"
          bash "${{ env.TOOLING_CHECKOUT_PATH }}/tool/release/setup_signing_keychain.sh" "$sign_env"
          # shellcheck source=/dev/null
          source "$sign_env"
          export MACOS_CERT_FILE MACOS_SIGNING_KEYCHAIN MACOS_SIGNING_KEYCHAIN_PATH
          dist="${{ env.RELEASE_SRC_PATH }}/dist/release"
          stage="${dist}/universal_automation_${VERSION}_${MATRIX_TRIPLE}"
          bash "${{ env.TOOLING_CHECKOUT_PATH }}/tool/release/codesign_macos_bundle.sh" "$stage"

      - name: Package release archive
        shell: bash
        env:
          RELEASE_ROOT: ${{ github.workspace }}/${{ env.RELEASE_SRC_PATH }}
          VERSION: ${{ needs.prepare.outputs.version }}
          MATRIX_TRIPLE: ${{ matrix.triple }}
          RELEASE_TOOLING_DIR: ${{ github.workspace }}/${{ env.TOOLING_CHECKOUT_PATH }}/tool/release
        run: |
          bash "${{ env.TOOLING_CHECKOUT_PATH }}/tool/release/build_release_artifacts.sh" \
            --version "$VERSION" \
            --triple "$MATRIX_TRIPLE" \
            --skip-sign \
            --package-only

      - name: Verify archive architecture (tooling script)
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          MATRIX_TRIPLE: ${{ matrix.triple }}
        run: |
          set -euo pipefail
          dist="${{ env.RELEASE_SRC_PATH }}/dist/release"
          case "$MATRIX_TRIPLE" in
            windows-x64)
              archive="${dist}/universal_automation_${VERSION}_windows-x64.zip"
              ;;
            *)
              archive="${dist}/universal_automation_${VERSION}_${MATRIX_TRIPLE}.tar.gz"
              ;;
          esac
          bash "${{ env.TOOLING_CHECKOUT_PATH }}/tool/release/verify_release_tarball_architecture.sh" \
            "$archive" "$MATRIX_TRIPLE"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.triple }}
          path: |
            ${{ env.RELEASE_SRC_PATH }}/dist/release/universal_automation_${{ needs.prepare.outputs.version }}_${{ matrix.triple }}.*

  dry-run-bundle:
    if: inputs.dry_run == true
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/release
          merge-multiple: true

      - name: Generate checksums
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          cd dist/release
          shopt -s nullglob
          files=(universal_automation_"${VERSION}"_*.tar.gz universal_automation_"${VERSION}"_*.zip)
          sha256sum "${files[@]}" > checksums.txt

      - name: Upload dry-run bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-dry-run-${{ needs.prepare.outputs.version }}
          path: dist/release/*
          if-no-files-found: error