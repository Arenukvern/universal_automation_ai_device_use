name: Release binaries publish
run-name: release-binaries-publish ${{ inputs.release_tag }}

on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
      version:
        required: true
        type: string
      tooling_ref:
        required: true
        type: string

permissions:
  contents: read

env:
  TOOLING_CHECKOUT_PATH: _tooling

jobs:
  publish:
    needs: [postflight]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout workflow tooling at caller commit
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tooling_ref }}
          path: ${{ env.TOOLING_CHECKOUT_PATH }}
          persist-credentials: false

      - name: Download release artifacts from this workflow run
        uses: actions/download-artifact@v4
        with:
          path: dist/release
          pattern: release-*
          merge-multiple: true

      - name: Generate checksums
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          cd dist/release
          shopt -s nullglob
          files=(universal_automation_"${VERSION}"_*.tar.gz universal_automation_"${VERSION}"_*.zip)
          sha256sum "${files[@]}" > checksums.txt

      - name: Guard against conflicting GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          VERSION: ${{ inputs.version }}
        run: |
          bash "${{ env.TOOLING_CHECKOUT_PATH }}/tool/release/check_release_assets_conflict.sh" \
            "$RELEASE_TAG" \
            "$VERSION"

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          append_body: true
          body: |
            ## Prebuilt `universal-automation` binaries

            macOS darwin archives are **signed with Developer ID** when the CI
            **Sign macOS bundle** step runs (`HAS_SIGNING=true` on the build job);
            otherwise they are **preview (unsigned)** (see [RELEASING.md](RELEASING.md)).

            Install without Dart:

            ```sh
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | bash -s -- --version ${{ inputs.version }}
            ```

            ```powershell
            irm https://raw.githubusercontent.com/${{ github.repository }}/main/install.ps1 | iex
            ```
          files: |
            dist/release/universal_automation_${{ inputs.version }}_darwin-arm64.tar.gz
            dist/release/universal_automation_${{ inputs.version }}_darwin-x64.tar.gz
            dist/release/universal_automation_${{ inputs.version }}_linux-x64.tar.gz
            dist/release/universal_automation_${{ inputs.version }}_windows-x64.zip
            dist/release/checksums.txt
          fail_on_unmatched_files: true

  postflight:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    needs: [publish]
    timeout-minutes: 10
    steps:
      - name: Checkout workflow tooling at caller commit
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tooling_ref }}
          path: ${{ env.TOOLING_CHECKOUT_PATH }}
          persist-credentials: false

      - name: Assert release has all assets and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          VERSION: ${{ inputs.version }}
        run: |
          bash "${{ env.TOOLING_CHECKOUT_PATH }}/tool/release/assert_release_assets_complete.sh" \
            "$RELEASE_TAG" \
            "$VERSION"