name: Release binaries publish
run-name: release-binaries-publish ${{ inputs.release_tag }}

on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
      version:
        required: true
        type: string
      tooling_ref:
        required: true
        type: string

permissions:
  contents: read

env:
  TOOLING_CHECKOUT_PATH: _tooling

jobs:
  publish:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout workflow tooling at caller commit
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tooling_ref }}
          path: ${{ env.TOOLING_CHECKOUT_PATH }}
          persist-credentials: false

      - name: Download release artifacts from this workflow run
        uses: actions/download-artifact@v4
        with:
          path: dist/release
          pattern: release-*
          merge-multiple: true

      - name: Generate checksums
        env:
          VERSION: ${{ inputs.version }}
        run: |
          bash "${{ env.TOOLING_CHECKOUT_PATH }}/tool/release/generate_release_checksums_in_dist.sh" \
            "$VERSION"

      - name: Guard against conflicting GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          VERSION: ${{ inputs.version }}
        run: |
          bash "${{ env.TOOLING_CHECKOUT_PATH }}/tool/release/check_release_assets_conflict.sh" \
            "$RELEASE_TAG" \
            "$VERSION"

      - name: Assert GitHub release is draft (immutable release policy)
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          bash "${{ env.TOOLING_CHECKOUT_PATH }}/tool/release/assert_github_release_is_draft.sh" \
            "$RELEASE_TAG"

      - name: Validate local checksums file
        env:
          VERSION: ${{ inputs.version }}
        run: |
          bash "${{ env.TOOLING_CHECKOUT_PATH }}/tool/release/validate_release_checksums_file.sh" \
            "$VERSION" \
            "dist/release/checksums.txt"

      - name: Append binary install notes to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          VERSION: ${{ inputs.version }}
          GITHUB_REPOSITORY_SLUG: ${{ github.repository }}
        run: |
          bash "${{ env.TOOLING_CHECKOUT_PATH }}/tool/release/append_binary_install_notes_to_draft_release.sh" \
            "$RELEASE_TAG"

      - name: Upload assets to draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          VERSION: ${{ inputs.version }}
        run: |
          bash "${{ env.TOOLING_CHECKOUT_PATH }}/tool/release/upload_draft_github_release_assets.sh" \
            "$RELEASE_TAG" \
            "dist/release"

      - name: Verify draft release asset set
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          VERSION: ${{ inputs.version }}
        run: |
          bash "${{ env.TOOLING_CHECKOUT_PATH }}/tool/release/assert_release_assets_complete_on_draft.sh" \
            "$RELEASE_TAG" \
            "$VERSION"

      - name: Publish GitHub release (undraft)
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          D: "false"
        run: |
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft="$D"

  postflight:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    needs: [publish]
    timeout-minutes: 15
    steps:
      - name: Checkout workflow tooling at caller commit
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tooling_ref }}
          path: ${{ env.TOOLING_CHECKOUT_PATH }}
          persist-credentials: false

      - name: Assert release has all assets and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          VERSION: ${{ inputs.version }}
        run: |
          bash "${{ env.TOOLING_CHECKOUT_PATH }}/tool/release/assert_release_assets_complete.sh" \
            "$RELEASE_TAG" \
            "$VERSION"

      - name: Download and verify published release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          VERSION: ${{ inputs.version }}
        run: |
          bash "${{ env.TOOLING_CHECKOUT_PATH }}/tool/release/verify_release_assets_downloadable.sh" \
            "$RELEASE_TAG" \
            "$VERSION"