name: universal_automation_semantics
description: >-
  The semantic view grammar for the universal automation family:
  declarative views over accessibility snapshots, ref-stable
  observations, observation diffs, and compact text rendering. Pure
  Dart, no Flutter, no protocol clients — every tier projects its tree
  into the family Snapshot and shares this layer.
version: 0.2.0
homepage: https://github.com/Arenukvern/universal_automation_ai_device_use
repository: https://github.com/Arenukvern/universal_automation_ai_device_use
issue_tracker: https://github.com/Arenukvern/universal_automation_ai_device_use/issues
documentation: https://github.com/Arenukvern/universal_automation_ai_device_use

environment:
  sdk: ^3.13.0

resolution: workspace

dependencies:
  meta: ^1.19.0
  universal_automation_interface: ^0.3.0

dev_dependencies:
  test: ^1.31.2
  xsoulspace_lints: ^0.1.2

topics:
  - automation
  - accessibility
  - agents
  - semantics
