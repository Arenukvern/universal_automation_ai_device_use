name: universal_browser_cdp
description: >-
  Pure-Dart Chrome DevTools Protocol (CDP) client: discovery, WebSocket
  JSON-RPC, accessibility snapshots, input synthesis, screenshots, and a
  fake CDP server for tests. No Flutter, no Node.
version: 0.3.0
homepage: https://github.com/Arenukvern/universal_automation_ai_device_use
repository: https://github.com/Arenukvern/universal_automation_ai_device_use
issue_tracker: https://github.com/Arenukvern/universal_automation_ai_device_use/issues
documentation: https://github.com/Arenukvern/universal_automation_ai_device_use/tree/main/pkgs/universal_browser_cdp

environment:
  sdk: ^3.13.0

resolution: workspace

dependencies:
  universal_automation_interface: ^0.3.0

dev_dependencies:
  test: ^1.31.2
  universal_automation_conformance: ^0.3.0
  xsoulspace_lints: ^0.1.2
topics:
  - automation
  - browser
  - cdp
  - devtools
