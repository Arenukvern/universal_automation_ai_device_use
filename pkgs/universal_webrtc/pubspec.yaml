name: universal_webrtc
description: >-
  High-level WebRTC for pure Dart over the webrtc-rs sidecar: signaling
  channel contracts, a loopback signaling implementation, a peer factory,
  and a FrameSink that pumps screencast frames through the WebRTC data
  channel.
version: 0.2.0
homepage: https://github.com/Arenukvern/universal_automation_ai_device_use
repository: https://github.com/Arenukvern/universal_automation_ai_device_use
issue_tracker: https://github.com/Arenukvern/universal_automation_ai_device_use/issues
documentation: https://github.com/Arenukvern/universal_automation_ai_device_use/tree/main/pkgs/universal_webrtc

environment:
  sdk: ^3.13.0

resolution: workspace

dependencies:
  universal_automation_interface: ^0.3.0
  universal_screencast: ^0.2.0
  universal_webrtc_raw: ^0.1.0

  meta: ^1.19.0
dev_dependencies:
  test: ^1.31.2
  xsoulspace_lints: ^0.1.2
topics:
  - webrtc
  - signaling
  - screencast
