name: universal_capture_macos
description: >-
  macOS-native screen capture and accessibility checks for pure Dart,
  wired through Dart native-assets build hooks (swiftc-compiled code
  asset, @Native bindings). No Flutter, no plugin surface.
version: 0.1.2
homepage: https://github.com/Arenukvern/universal_automation_ai_device_use
repository: https://github.com/Arenukvern/universal_automation_ai_device_use
issue_tracker: https://github.com/Arenukvern/universal_automation_ai_device_use/issues
documentation: https://github.com/Arenukvern/universal_automation_ai_device_use/tree/main/pkgs/universal_capture_macos

environment:
  sdk: ^3.13.0

resolution: workspace

dependencies:
  code_assets: ^2.0.0
  ffi: ^2.2.0
  hooks: ^2.0.0
  universal_automation_interface: ^0.3.0
  universal_screencast: ^0.1.0

dev_dependencies:
  test: ^1.31.2
  xsoulspace_lints: ^0.1.2
topics:
  - macos
  - screen-capture
  - accessibility
