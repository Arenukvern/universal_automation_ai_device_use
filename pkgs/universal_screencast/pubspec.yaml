name: universal_screencast
description: >-
  Declarative frame pipeline for automation targets: FrameSource (CDP
  screencast, paced polling) to FrameSink (binary WebSocket, MJPEG HTTP,
  file recorder) with fail-closed composition validation and audience
  policies.
version: 0.3.0
homepage: https://github.com/Arenukvern/universal_automation_ai_device_use
repository: https://github.com/Arenukvern/universal_automation_ai_device_use
issue_tracker: https://github.com/Arenukvern/universal_automation_ai_device_use/issues
documentation: https://github.com/Arenukvern/universal_automation_ai_device_use/tree/main/pkgs/universal_screencast

environment:
  sdk: ^3.13.0

resolution: workspace

dependencies:
  meta: ^1.19.0
  universal_automation_interface: ^0.3.0
  universal_browser_cdp: ^0.4.0

dev_dependencies:
  test: ^1.31.2
  universal_automation_conformance: ^0.3.0
  xsoulspace_lints: ^0.1.2
topics:
  - screencast
  - frames
  - pipeline
  - mjpeg
