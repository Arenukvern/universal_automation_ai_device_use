  versioned commands that compile to AutomationPlan, budgets as enforceable
  components, and a rule/guide envelope whose content stays world data.
version: 0.1.1
homepage: https://github.com/Arenukvern/universal_automation_ai_device_use
repository: https://github.com/Arenukvern/universal_automation_ai_device_use
