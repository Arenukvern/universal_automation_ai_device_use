documentation: https://github.com/Arenukvern/universal_automation_ai_device_use

environment:
  sdk: ^3.13.0

resolution: workspace

dependencies:
  meta: ^1.19.0
  universal_automation_interface: ^0.3.0
  universal_automation_semantics: ^0.2.0
  universal_automation_toolkit: ^0.2.0

dev_dependencies:
  test: ^1.31.2
  xsoulspace_lints: ^0.1.2

topics:
  - automation
  - composition
  - mcp
