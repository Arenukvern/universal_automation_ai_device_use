name: universal_automation_toolkit
description: >-
  Agent-facing surface for the universal automation family: declarative
  plans with a fail-closed runner, an observe/act/verify CLI, and an MCP
  stdio server. One binary, two faces. No Flutter, no process lifecycle.
version: 0.1.1
homepage: https://github.com/Arenukvern/universal_automation_ai_device_use
repository: https://github.com/Arenukvern/universal_automation_ai_device_use
issue_tracker: https://github.com/Arenukvern/universal_automation_ai_device_use/issues
documentation: https://github.com/Arenukvern/universal_automation_ai_device_use

environment:
  sdk: ^3.13.0

resolution: workspace

dependencies:
  args: ^2.7.0
  meta: ^1.19.0
  universal_automation_interface: ^0.3.0
  universal_automation_semantics: ^0.1.0
  universal_browser_cdp: ^0.3.0
  universal_browser_webdriver: ^0.1.1
  universal_driver_linux: ^0.1.1
  universal_driver_macos: ^0.2.1
  universal_driver_windows: ^0.1.1
  universal_screencast: ^0.1.2
  xsoulspace_permission_core: ^0.1.0
  yaml: ^3.1.3

dev_dependencies:
  test: ^1.31.2
  xsoulspace_lints: ^0.1.2

executables:
  # bin/universal_automation.dart → `universal-automation` on PATH
  universal-automation: universal_automation

topics:
  - automation
  - browser
  - cli
  - mcp
