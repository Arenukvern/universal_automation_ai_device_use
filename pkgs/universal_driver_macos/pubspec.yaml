name: universal_driver_macos
description: >-
  macOS accessibility driver for the universal automation family:
  semantic snapshot and element-at-position over AXUIElement, input
  synthesis over CGEvent. Pure Dart through native-assets build hooks
  (swiftc-compiled code asset, @Native bindings). No Flutter, no plugin
  surface.
version: 0.4.0
homepage: https://github.com/Arenukvern/universal_automation_ai_device_use
repository: https://github.com/Arenukvern/universal_automation_ai_device_use
issue_tracker: https://github.com/Arenukvern/universal_automation_ai_device_use/issues
documentation: https://github.com/Arenukvern/universal_automation_ai_device_use/tree/main/pkgs/universal_driver_macos

environment:
  sdk: ^3.13.0

resolution: workspace

topics:
  - macos
  - accessibility
  - automation

dependencies:
  code_assets: ^2.0.0
  ffi: ^2.2.0
  hooks: ^2.0.0
  universal_automation_interface: ^0.3.0

dev_dependencies:
  test: ^1.31.2
  universal_automation_conformance: ^0.3.0
  xsoulspace_lints: ^0.1.2
