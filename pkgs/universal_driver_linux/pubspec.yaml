name: universal_driver_linux
description: >-
  Linux accessibility driver for the universal automation family: an
  AT-SPI2 (D-Bus) observe/act driver in pure Dart, mapping the platform
  accessibility tree onto the family's semantic snapshot model.
version: 0.1.1
homepage: https://github.com/Arenukvern/universal_automation_ai_device_use
repository: https://github.com/Arenukvern/universal_automation_ai_device_use
issue_tracker: https://github.com/Arenukvern/universal_automation_ai_device_use/issues
documentation: https://github.com/Arenukvern/universal_automation_ai_device_use/tree/main/pkgs/universal_driver_linux

environment:
  sdk: ^3.13.0

resolution: workspace

dependencies:
  meta: ^1.19.0
  dbus: ^0.7.10
  universal_automation_interface: ^0.2.0

dev_dependencies:
  test: ^1.31.2
  universal_automation_conformance: ^0.2.0
  xsoulspace_lints: ^0.1.2
