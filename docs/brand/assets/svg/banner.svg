<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 400" role="img" aria-label="Hopeful device automation for people and agents">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="45%" stop-color="#2d4a6f"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="dawn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="400" fill="url(#sky)"/>
  <rect width="1600" height="400" fill="url(#dawn)"/>
  <circle cx="1320" cy="72" r="48" fill="#fbbf24" opacity="0.35"/>
  <!-- composable blocks -->
  <g fill="none" stroke="url(#accent)" stroke-width="2.5" opacity="0.9">
    <rect x="96" y="88" width="72" height="72" rx="12"/>
    <rect x="184" y="88" width="72" height="72" rx="12"/>
    <rect x="272" y="88" width="72" height="72" rx="12"/>
    <rect x="140" y="176" width="128" height="72" rx="12"/>
    <path d="M168 160v16M240 160v16M304 176h-48"/>
  </g>
  <!-- human + agent collaboration (abstract, humane) -->
  <g transform="translate(420 120)">
    <circle cx="48" cy="40" r="22" fill="#fde68a"/>
    <path d="M20 120c8-28 24-40 48-40s40 12 48 40" fill="#fde68a"/>
    <circle cx="140" cy="48" r="18" fill="#bae6fd" stroke="#38bdf8" stroke-width="2"/>
    <path d="M116 120c6-20 18-32 36-32h8c18 0 30 12 36 32" fill="#bae6fd" opacity="0.85"/>
    <path d="M88 72h24" stroke="#f8fafc" stroke-width="3" stroke-linecap="round"/>
    <circle cx="100" cy="72" r="5" fill="#fbbf24"/>
    <circle cx="112" cy="72" r="5" fill="#38bdf8"/>
  </g>
  <!-- devices -->
  <g fill="#e2e8f0">
    <rect x="620" y="118" width="180" height="110" rx="10"/>
    <rect x="640" y="134" width="140" height="78" rx="6" fill="#0f172a" opacity="0.25"/>
    <path d="M600 240h220l-14 16H614z"/>
    <rect x="840" y="108" width="48" height="96" rx="10"/>
    <rect x="920" y="124" width="110" height="80" rx="10"/>
  </g>
  <text x="96" y="318" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="38" font-weight="700">
    Open devices to people and agents, with care
  </text>
  <text x="96" y="358" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="20">
