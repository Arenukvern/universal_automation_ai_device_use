name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  # workflow_dispatch creation (dart_changesets starts publish runs via gh workflow run).
  actions: write

concurrency:
  group: dart-changesets-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # checkout@v7 default persist-credentials writes an includeIf git-credentials file;
      # dart_changesets also sets http.extraHeader → duplicate Authorization on git push (HTTP 400).
      # Upstream dart_changesets should unset includeIf credential configs; disable persist here meanwhile.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: Arenukvern/dart_changesets@v1
        with:
          # Secret name is legacy (Release Please); could rename later (e.g. DART_CHANGESETS_TOKEN).
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}