name: universal_tooling_runtime CI

on:
  pull_request:
    paths:
      - 'pkgs/universal_tooling_runtime/**'
      - '.github/workflows/tooling_runtime_ci.yml'
      - '.github/workflows/publish_package.yml'
  push:
    branches:
      - main
    paths:
      - 'pkgs/universal_tooling_runtime/**'
      - '.github/workflows/tooling_runtime_ci.yml'
      - '.github/workflows/publish_package.yml'
  # Dispatched from release-please.yml after constraint sync (see Validate).
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact commit on release-please--branches--main to verify.
        required: false
        type: string

jobs:
  ci:
    name: Analyze, test, publish dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify expected sync SHA
        if: ${{ inputs.expected_sha != '' }}
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          if ! [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::expected_sha must be a 40-character git SHA (got: $EXPECTED_SHA)"
            exit 1
          fi
          actual=$(git rev-parse HEAD)
          if [ "$actual" != "$EXPECTED_SHA" ]; then
            echo "::error::Expected checkout $EXPECTED_SHA but HEAD is $actual"
            exit 1
          fi

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Check intra-workspace pub constraints
        run: dart run tool/sync_workspace_pub_constraints.dart --check

      - name: Resolve workspace
        run: dart pub get

      - name: Analyze
        run: dart analyze
        working-directory: pkgs/universal_tooling_runtime

      - name: Test
        run: dart test --concurrency=1
        working-directory: pkgs/universal_tooling_runtime

      - name: Publish dry run
        run: dart pub publish --dry-run
        working-directory: pkgs/universal_tooling_runtime
