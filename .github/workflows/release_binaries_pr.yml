name: Release binaries PR smoke

on:
  pull_request:
    paths:
      - pkgs/universal_automation_toolkit/**
      - pkgs/universal_*/**
      - tool/release/**
      - install.sh
      - install.ps1
      - .github/workflows/release_binaries*.yml
      - release-please-config.json
      - .release-please-manifest.json
  push:
    branches:
      - main
    paths:
      - pkgs/universal_automation_toolkit/**
      - pkgs/universal_*/**
      - tool/release/**
      - install.sh
      - install.ps1
      - .github/workflows/release_binaries*.yml
      - release-please-config.json
      - .release-please-manifest.json

permissions:
  contents: read

concurrency:
  group: release-binaries-pr-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  smoke:
    # Relative ./ resolves workflow_call from default branch until merged; pin branch on PRs.
    uses: Arenukvern/universal_automation_ai_device_use/.github/workflows/release_binaries.yml@cursor/release-binaries-auto-99f0
    permissions:
      contents: read
    secrets: inherit
    with:
      release_tag: ${{ github.event.pull_request.head.sha || github.sha }}
      dry_run: true