name: Release binaries PR smoke

on:
  pull_request:
    paths:
      - pkgs/universal_automation_toolkit/**
      - pkgs/universal_*/**
      - tool/release/**
      - install.sh
      - install.ps1
      - .github/workflows/release_binaries*.yml
      - release-please-config.json
      - .release-please-manifest.json
  push:
    branches:
      - main
    paths:
      - pkgs/universal_automation_toolkit/**
      - pkgs/universal_*/**
      - tool/release/**
      - install.sh
      - install.ps1
      - .github/workflows/release_binaries*.yml
      - release-please-config.json
      - .release-please-manifest.json

permissions:
  contents: read

concurrency:
  group: release-binaries-pr-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  smoke:
    # Pin branch (slashes need refs/heads/ — bare @cursor/… is parsed as owner/path).
    uses: Arenukvern/universal_automation_ai_device_use/.github/workflows/release_binaries.yml@refs/heads/cursor/release-binaries-auto-99f0
    permissions:
      contents: read
    with:
      release_tag: ${{ github.event.pull_request.head.sha || github.sha }}
      dry_run: true