name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  release-please:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      paths_released: ${{ steps.release.outputs.paths_released }}
      release_outputs_json: ${{ toJSON(steps.release.outputs) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Release Please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  sync-release-pr-constraints:
    needs: release-please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Nested checkout: sibling Dart workspace for package: resolution; cwd stays
      # the release tree so findWorkspaceRepoRoot() reads pkgs/ and manifest there.
      - name: Checkout trusted tooling (triggering main commit)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Resolve trusted workspace (tooling)
        working-directory: trusted
        run: dart pub get

      # Runs on push to main or workflow_dispatch from main (see release-please
      # job `if`). Sync pushes to release-please--branches--main cannot re-enter
      # this workflow via push; dispatch from non-main refs is refused.
      - name: Sync intra-workspace pub constraints on release PR
        id: sync_constraints
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! git ls-remote --heads origin release-please--branches--main | grep -q .; then
            echo "No release-please branch; skipping constraint sync"
            echo "sync_pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch origin release-please--branches--main
          git checkout -B release-please--branches--main origin/release-please--branches--main
          echo 'trusted/' >> .git/info/exclude
          dart run trusted/tool/sync_workspace_pub_constraints.dart --write
          dart run trusted/tool/check_hosted_deps_resolve.dart --co-release --check-manifest-drift --release-pr
          # Constraint sync commits stay `chore:` (no release-please bump). When
          # a pub.dev-shipped package's universal_* pins change, land a scoped
          # fix(<package>) on main so release-please bumps — see
          # RELEASING.md "Intra-workspace constraint sync".
          if git diff --quiet -- pkgs; then
            echo "Workspace pub constraints already in sync"
            echo "sync_pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            path="${line:3}"
            case "$path" in
              pkgs/*) ;;
              *)
                echo "Refusing to commit: change outside pkgs/: $path"
                git status --porcelain
                exit 1
                ;;
            esac
          done < <(git status --porcelain)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pkgs/*/pubspec.yaml
          git commit -m "chore: sync intra-workspace pub dependency constraints"
          git push origin HEAD:release-please--branches--main
          echo "sync_pushed=true" >> "$GITHUB_OUTPUT"

      - name: Dispatch CI on release PR branch
        if: ${{ steps.sync_constraints.outputs.sync_pushed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_BRANCH: release-please--branches--main
        run: |
          echo "Dispatching Validate and tooling_runtime CI for ${RELEASE_BRANCH}"
          gh workflow run validate.yml --repo "${GH_REPO}" --ref "${RELEASE_BRANCH}"
          gh workflow run tooling_runtime_ci.yml --repo "${GH_REPO}" --ref "${RELEASE_BRANCH}"

  dispatch-package-publish:
    needs: release-please
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Resolve workspace (tooling)
        run: dart pub get

      - name: Dispatch pub.dev publish per released package
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_PLEASE_OUTPUTS: ${{ needs.release-please.outputs.release_outputs_json }}
        run: dart run tool/dispatch_pub_dev_publish.dart
