name: Release runner retry
run-name: release-runner-retry ${{ github.event.workflow_run.name }} (${{ github.event.workflow_run.id }})

# Auto-retry failed jobs when a release train workflow failed only because hosted
# runners were not acquired. Uses tooling on the default branch only — never the
# triggering workflow's head commit.
on:
  workflow_run:
    workflows:
      - Release Please
      - Release binaries build
      - Release binaries (toolkit)
    types:
      - completed

permissions:
  actions: write
  contents: read

concurrency:
  group: release-runner-retry-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  maybe-retry:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event != 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout release retry tooling (default branch)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: |
            tool/
            pubspec.yaml
          sparse-checkout-cone-mode: true
          persist-credentials: false

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Classify and retry hosted runner acquisition failures
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          RETRY_BACKOFF_SECONDS: '180'
        run: dart run tool/release_runner_acquisition_retry.dart