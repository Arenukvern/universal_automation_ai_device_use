name: Validate

on:
  pull_request:
  push:
    branches:
      - main
  # GITHUB_TOKEN pushes to release-please--branches--main do not trigger pull_request.
  workflow_dispatch:
    inputs:
      expected_sha:
        description: >-
          When dispatched from release-please constraint sync, the exact commit
          on release-please--branches--main that must be checked out.
        required: false
        type: string

env:
  IS_RELEASE_PLEASE: >-
    ${{ github.head_ref == 'release-please--branches--main' || github.ref_name == 'release-please--branches--main' }}

jobs:
  analyze:
    name: dart analyze (steward gate)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify expected sync SHA
        if: ${{ inputs.expected_sha != '' }}
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          if ! [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::expected_sha must be a 40-character git SHA (got: $EXPECTED_SHA)"
            exit 1
          fi
          actual=$(git rev-parse HEAD)
          if [ "$actual" != "$EXPECTED_SHA" ]; then
            echo "::error::Expected checkout $EXPECTED_SHA but HEAD is $actual"
            exit 1
          fi
          echo "Verified checkout at synced release PR commit $actual"

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Resolve workspace (tooling)
        run: dart pub get

      - name: Check intra-workspace pub constraints
        run: dart run tool/sync_workspace_pub_constraints.dart --check

      - name: Releasable workspace (co-release, blocking)
        run: dart run tool/check_hosted_deps_resolve.dart --co-release --warn-manifest-behind-pub

      - name: Report manifest drift (non-blocking)
        if: ${{ env.IS_RELEASE_PLEASE != 'true' }}
        continue-on-error: true
        run: dart run tool/check_hosted_deps_resolve.dart --manifest-drift-only --github-report --warn-manifest-behind-pub

      - name: Report pub.dev audit (non-blocking)
        if: ${{ env.IS_RELEASE_PLEASE != 'true' }}
        continue-on-error: true
        run: dart run tool/check_hosted_deps_resolve.dart --audit-published --github-report

      - name: Release-please PR — co-release + drift (blocking)
        if: ${{ env.IS_RELEASE_PLEASE == 'true' }}
        run: dart run tool/check_hosted_deps_resolve.dart --co-release --check-manifest-drift --release-pr

      - name: Release-please PR — publishable packages analyze/test (blocking)
        if: ${{ env.IS_RELEASE_PLEASE == 'true' }}
        run: dart run tool/validate_publishable_packages.dart

      - name: Release-please PR — pub.dev audit (blocking)
        if: ${{ env.IS_RELEASE_PLEASE == 'true' }}
        run: dart run tool/check_hosted_deps_resolve.dart --audit-published --release-pr

      - name: Check reusable workflow inputs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: dart run tool/check_reusable_workflow_inputs.dart

      - name: Resolve workspace
        run: dart pub get

      - name: Tool unit tests
        run: dart test tool/

      - name: Analyze packages (steward.yaml quality.validate)
        run: |
          set -euo pipefail
          dart analyze \
            pkgs/universal_automation_interface \
            pkgs/universal_automation_semantics \
            pkgs/universal_automation_conformance \
            pkgs/universal_browser_cdp \
            pkgs/universal_screencast \
            pkgs/universal_webrtc_raw \
            pkgs/universal_tooling_runtime
