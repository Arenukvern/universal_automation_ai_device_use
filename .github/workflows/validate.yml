name: Validate

on:
  pull_request:
  push:
    branches:
      - main
  # GITHUB_TOKEN pushes to release-please--branches--main do not trigger pull_request.
  workflow_dispatch:

jobs:
  analyze:
    name: dart analyze (steward gate)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Check intra-workspace pub constraints
        run: dart run tool/sync_workspace_pub_constraints.dart --check

      - name: Check reusable workflow inputs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: dart run tool/check_reusable_workflow_inputs.dart

      - name: Resolve workspace
        run: dart pub get

      - name: Analyze packages (steward.yaml quality.validate)
        run: |
          set -euo pipefail
          dart analyze \
            pkgs/universal_automation_interface \
            pkgs/universal_automation_semantics \
            pkgs/universal_automation_conformance \
            pkgs/universal_browser_cdp \
            pkgs/universal_screencast \
            pkgs/universal_webrtc_raw \
            pkgs/universal_tooling_runtime
