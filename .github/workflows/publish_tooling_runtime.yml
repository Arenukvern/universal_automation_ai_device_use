# Publish pkgs/universal_tooling_runtime to pub.dev (OIDC).
# Triggered by tag push or workflow_dispatch with --ref pointing at the release tag.
# release-please dispatches workflow_dispatch because GITHUB_TOKEN tag pushes do not
# fire other workflows.

name: Publish universal_tooling_runtime

on:
  push:
    tags:
      - 'universal_tooling_runtime-v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  require-tag-ref:
    name: Require release tag ref
    runs-on: ubuntu-latest
    steps:
      - name: Refuse branch or wrong tag refs
        run: |
          if [[ "${GITHUB_REF}" =~ ^refs/tags/universal_tooling_runtime-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Publishing from ${GITHUB_REF}"
          else
            echo "::error::Refusing publish: GITHUB_REF must be refs/tags/universal_tooling_runtime-vX.Y.Z."
            echo "For manual recovery, run: gh workflow run publish_tooling_runtime.yml --ref universal_tooling_runtime-vX.Y.Z"
            exit 1
          fi

  ci:
    name: Analyze, test, dry-run
    needs: require-tag-ref
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Resolve workspace
        run: dart pub get

      - name: Analyze
        run: dart analyze
        working-directory: pkgs/universal_tooling_runtime

      - name: Test
        run: dart test --concurrency=1
        working-directory: pkgs/universal_tooling_runtime

      - name: Publish dry run
        run: dart pub publish --dry-run
        working-directory: pkgs/universal_tooling_runtime

  publish:
    name: Publish to pub.dev
    needs: ci
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      working-directory: pkgs/universal_tooling_runtime
      use-flutter: false
