name: Release binaries (toolkit)

# Release Please creates tags/releases with GITHUB_TOKEN; those events do not
# trigger other workflows. Dispatch explicitly from release-please.yml / train.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: >-
          Toolkit release tag (e.g. universal_automation_toolkit-v0.5.1).
          Attach assets to the existing GitHub Release for that tag.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-binaries-${{ inputs.release_tag }}
  cancel-in-progress: false

env:
  TOOLING_CHECKOUT_PATH: _tooling
  RELEASE_SRC_PATH: release-src

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      version: ${{ steps.resolve.outputs.version }}
      release_sha: ${{ steps.release_sha.outputs.sha }}
    steps:
      - name: Checkout workflow tooling (trusted SHA on main)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: ${{ env.TOOLING_CHECKOUT_PATH }}
          persist-credentials: false

      - name: Resolve release target
        id: resolve
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          DISPATCH_RELEASE_TAG: ${{ inputs.release_tag }}
        run: bash "${{ env.TOOLING_CHECKOUT_PATH }}/tool/release/resolve_release_tag.sh"

      - name: Checkout release source (immutable tag)
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ steps.resolve.outputs.release_tag }}
          path: ${{ env.RELEASE_SRC_PATH }}
          fetch-depth: 1

      - id: release_sha
        name: Record and verify release commit SHA
        env:
          RELEASE_TAG: ${{ steps.resolve.outputs.release_tag }}
        run: |
          set -euo pipefail
          tag_sha="$(git -C "${{ env.RELEASE_SRC_PATH }}" rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          head_sha="$(git -C "${{ env.RELEASE_SRC_PATH }}" rev-parse "HEAD^{commit}")"
          if [[ "$tag_sha" != "$head_sha" ]]; then
            echo "::error::release-src HEAD ($head_sha) != tag^{commit} ($tag_sha)"
            exit 1
          fi
          echo "sha=$head_sha" >> "$GITHUB_OUTPUT"

      - name: Assert pubspec version at release source matches tag
        env:
          RELEASE_ROOT: ${{ github.workspace }}/${{ env.RELEASE_SRC_PATH }}
        run: |
          bash "${{ env.TOOLING_CHECKOUT_PATH }}/tool/release/assert_release_tag.sh" \
            "${{ steps.resolve.outputs.release_tag }}"

      - name: Verify GitHub release exists
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          bash "${{ env.TOOLING_CHECKOUT_PATH }}/tool/release/assert_github_release_exists.sh" \
            "${{ steps.resolve.outputs.release_tag }}"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - triple: darwin-arm64
            runner: macos-15
          - triple: darwin-x64
            runner: macos-13
          - triple: linux-x64
            runner: ubuntu-latest
          - triple: windows-x64
            runner: windows-latest

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45

    steps:
      - name: Checkout workflow tooling (trusted SHA)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: ${{ env.TOOLING_CHECKOUT_PATH }}
          persist-credentials: false

      - name: Checkout release source (immutable tag)
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.prepare.outputs.release_tag }}
          path: ${{ env.RELEASE_SRC_PATH }}
          fetch-depth: 1

      - name: Verify release source SHA
        shell: bash
        run: |
          bash "${{ env.TOOLING_CHECKOUT_PATH }}/tool/release/verify_release_source_checkout.sh" \
            "${{ env.RELEASE_SRC_PATH }}" \
            "${{ needs.prepare.outputs.release_tag }}" \
            "${{ needs.prepare.outputs.release_sha }}"

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Build release artifacts
        shell: bash
        env:
          RELEASE_ROOT: ${{ github.workspace }}/${{ env.RELEASE_SRC_PATH }}
          VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_TOOLING_DIR: ${{ github.workspace }}/${{ env.TOOLING_CHECKOUT_PATH }}/tool/release
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          bash "${{ env.TOOLING_CHECKOUT_PATH }}/tool/release/build_release_artifacts.sh" \
            --version "$VERSION" \
            --triple "${{ matrix.triple }}"

      - name: Verify archive architecture (trusted tooling script)
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          dist="${{ env.RELEASE_SRC_PATH }}/dist/release"
          case "${{ matrix.triple }}" in
            windows-x64)
              archive="${dist}/universal_automation_${VERSION}_windows-x64.zip"
              ;;
            *)
              archive="${dist}/universal_automation_${VERSION}_${{ matrix.triple }}.tar.gz"
              ;;
          esac
          bash "${{ env.TOOLING_CHECKOUT_PATH }}/tool/release/verify_release_tarball_architecture.sh" \
            "$archive" "${{ matrix.triple }}"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.triple }}
          path: |
            ${{ env.RELEASE_SRC_PATH }}/dist/release/universal_automation_${{ needs.prepare.outputs.version }}_${{ matrix.triple }}.*
          if-no-files-found: error

  publish:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: [prepare, build]
    timeout-minutes: 15

    steps:
      - name: Checkout workflow tooling (trusted SHA)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: ${{ env.TOOLING_CHECKOUT_PATH }}
          persist-credentials: false

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/release
          merge-multiple: true

      - name: Generate checksums
        run: |
          set -euo pipefail
          cd dist/release
          shopt -s nullglob
          files=(universal_automation_${{ needs.prepare.outputs.version }}_*.tar.gz universal_automation_${{ needs.prepare.outputs.version }}_*.zip)
          sha256sum "${files[@]}" > checksums.txt

      - name: Guard against conflicting GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          bash "${{ env.TOOLING_CHECKOUT_PATH }}/tool/release/check_release_assets_conflict.sh" \
            "${{ needs.prepare.outputs.release_tag }}" \
            "${{ needs.prepare.outputs.version }}"

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.release_tag }}
          body: |
            ## Prebuilt `universal-automation` binaries

            macOS builds are **preview (unsigned)** until Apple code signing
            secrets are configured (see [RELEASING.md](RELEASING.md)).

            Install without Dart:

            ```sh
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | bash -s -- --version ${{ needs.prepare.outputs.version }}
            ```

            ```powershell
            irm https://raw.githubusercontent.com/${{ github.repository }}/main/install.ps1 | iex
            ```
          files: |
            dist/release/universal_automation_${{ needs.prepare.outputs.version }}_darwin-arm64.tar.gz
            dist/release/universal_automation_${{ needs.prepare.outputs.version }}_darwin-x64.tar.gz
            dist/release/universal_automation_${{ needs.prepare.outputs.version }}_linux-x64.tar.gz
            dist/release/universal_automation_${{ needs.prepare.outputs.version }}_windows-x64.zip
            dist/release/checksums.txt
          fail_on_unmatched_files: true

  postflight:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    needs: [prepare, publish]
    timeout-minutes: 10
    steps:
      - name: Checkout workflow tooling (trusted SHA)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: ${{ env.TOOLING_CHECKOUT_PATH }}
          persist-credentials: false

      - name: Assert release has all assets and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          bash "${{ env.TOOLING_CHECKOUT_PATH }}/tool/release/assert_release_assets_complete.sh" \
            "${{ needs.prepare.outputs.release_tag }}" \
            "${{ needs.prepare.outputs.version }}"