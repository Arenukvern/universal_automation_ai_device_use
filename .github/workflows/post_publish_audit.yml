# Manual post-publish verification: every workspace package latest on pub.dev
# must resolve sibling dependencies (fail closed).
#
# Also runs automatically at the end of `dart run tool/publish_in_order.dart --publish`.

name: Post-publish audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: pub.dev sibling dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Resolve workspace (tooling)
        run: dart pub get

      - name: Audit published packages on pub.dev
        run: dart run tool/check_hosted_deps_resolve.dart --audit-published
